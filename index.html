<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic Page Setup -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Roulette</title>

    <!-- Styling for layout, animations, wheel design, buttons, and result display -->
    <style>
        /* Reset default browser styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body background and centering */
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #000000 0%, #0a0a0a 25%, #1a1410 50%, #0a0a0a 75%, #000000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Georgia', serif;
            overflow: hidden;
            position: relative;
            padding: 20px;
        }

        /* Decorative radial light background */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(139, 101, 8, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(139, 101, 8, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        /* Centered container for all elements */
        .container {
            text-align: center;
            padding: 20px;
            animation: fadeIn 1s ease;
            max-width: 100%;
        }

        /* Fade-in animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Page Title Style */
        h1 {
            color: transparent;
            background: linear-gradient(135deg, #8b6508, #b8860b, #8b6508, #6b5208);
            background-clip: text;
            -webkit-background-clip: text;
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(139, 101, 8, 0.3);
            font-weight: bold;
            letter-spacing: 3px;
        }

        /* Subtitle (optional) */
        .subtitle {
            color: #8b6508;
            font-size: 1.2rem;
            margin-bottom: 30px;
            font-style: italic;
            opacity: 0.8;
        }

        /* Container for the roulette wheel */
        .roulette-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 500px;
            margin: 0 auto;
        }

        /* Outer decorative gold ring */
        .outer-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #8b6508, #5a4005, #8b6508, #5a4005);
            padding: 15px;
            box-shadow: 
                0 0 50px rgba(139, 101, 8, 0.2),
                inset 0 0 20px rgba(0, 0, 0, 0.8),
                0 10px 40px rgba(0, 0, 0, 0.8);
        }

        /* Middle black ring */
        .middle-ring {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border-radius: 50%;
            background: #1a1410;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9);
        }

        /* Wheel container where SVG is injected */
        .wheel {
            position: absolute;
            top: 25px;
            left: 25px;
            right: 25px;
            bottom: 25px;
            border-radius: 50%;
            overflow: hidden;
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            box-shadow: 
                inset 0 0 0 2px #8b6508,
                inset 0 0 20px rgba(0, 0, 0, 0.5);
            background: #2a2a2a;
        }

        /* Inner segments (unused since using SVG) */
        .wheel-segment {
            position: absolute;
            top: 0;
            left: 50%;
            width: 50%;
            height: 50%;
            transform-origin: 0% 100%;
            overflow: hidden;
        }

        .segment-inner {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
        }

        /* Red segment styling */
        .segment-red .segment-inner {
            background: linear-gradient(45deg, #8B0000, #DC143C, #8B0000);
        }

        /* Black segment styling */
        .segment-black .segment-inner {
            background: linear-gradient(45deg, #000000, #2a2a2a, #000000);
        }

        /* Center circle (button to spin the wheel) */
        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, #8b6508, #8b6508);
            border-radius: 50%;
            z-index: 10;
            box-shadow: 
                0 0 30px rgba(155, 116, 17, 0.4),
                0 5px 15px rgba(68, 54, 11, 0.7),
                inset 0 -3px 5px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s;
            border: 3px solid #2a2015;
        }

        .center-circle:hover {
            transform: translate(-50%, -50%) scale(1.05);
        }

        .center-circle::before {
            content: 'GIRA';
            color: #ffffff;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 3px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        /* Arrow/pointer indicating the top of the wheel */
        .pointer {
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #8b6508;
            z-index: 11;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.7));
            animation: pulse 1s ease-in-out infinite;
        }

        .pointer::after {
            content: '';
            position: absolute;
            left: -10px;
            top: -35px;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 20px solid #5a4005;
        }

        @keyframes pulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.05); }
        }

        /* Result box below the wheel */
        .result {
            margin-top: 30px;
            padding: 20px;
            background: linear-gradient(135deg, rgba(139, 101, 8, 0.1), rgba(0, 0, 0, 0.5));
            border-radius: 10px;
            border: 1px solid #8b6508;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .result::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(139, 101, 8, 0.1), transparent);
            animation: slide 3s linear infinite;
        }

        @keyframes slide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .result-text {
            color: #b8860b;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(139, 101, 8, 0.3);
            position: relative;
            z-index: 1;
        }

        /* Result pulse animation on win */
        .win-animation {
            animation: winPulse 1s ease-in-out;
        }

        @keyframes winPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* Animated gold border */
        .decorative-border {
            position: absolute;
            inset: -20px;
            border: 2px solid transparent;
            border-image: linear-gradient(45deg, #8b6508, transparent, #8b6508) 1;
            border-radius: 50%;
            animation: rotate 20s linear infinite;
            pointer-events: none;
            opacity: 0.5;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Main Container -->
    <div class="container">
        <!-- Logo -->
        <img src="src/Diseño sin título.png" alt="PlayCity Logo" style="width:300px; height:auto;">
        <h1>¡Bienvenidos a Octopy!</h1>
        <div style="height: 75px;"></div>

        <!-- Roulette Wheel -->
        <div class="roulette-wrapper">
            <div class="decorative-border"></div>
            <div class="pointer"></div>
            <div class="outer-ring">
                <div class="middle-ring">
                    <!-- SVG Wheel gets injected here -->
                    <div class="wheel" id="wheel-svg-container"></div>
                    <!-- Spin Button -->
                    <div class="center-circle" onclick="spin()"></div>
                </div>
            </div>
        </div>

        <!-- Prize result display -->
        <div class="result">
            <div class="result-text" id="result">¿Listo para probar su suerte?</div>
        </div>
    </div>

    <!-- JavaScript Section -->
    <script>
        // Prize data with weight for probability logic
        const prizes = [
            { number: 1, color: 'red', prize: 'Bocina Bluetooth', weight: 3 },
            { number: 2, color: 'black', prize: 'Descuento 10%', weight: 12 },
            { number: 3, color: 'red', prize: 'Vacaciones', weight: 2 },
            { number: 4, color: 'black', prize: 'Decuento 5%', weight: 25 },
            { number: 5, color: 'red', prize: 'Cuponera', weight: 10 },
            { number: 6, color: 'black', prize: 'Bolsa de Regalo', weight: 6 },
            { number: 7, color: 'red', prize: 'Termo', weight: 6 },
            { number: 8, color: 'black', prize: 'Camioneta SUV', weight: 1 }
        ];

        // Dynamically draw the SVG wheel
        function createWheel() {
            const size = 420;
            const radius = size / 2;
            const segmentAngle = 360 / prizes.length;
            const wheel = document.getElementById('wheel-svg-container');
            let svg = `<svg id="wheel-svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="border-radius:50%;overflow:visible;">`;

            prizes.forEach((prize, i) => {
                const startAngle = i * segmentAngle - 90;
                const endAngle = startAngle + segmentAngle;

                // Calculate arc start and end points
                const x1 = radius + radius * Math.cos(Math.PI * startAngle / 180);
                const y1 = radius + radius * Math.sin(Math.PI * startAngle / 180);
                const x2 = radius + radius * Math.cos(Math.PI * endAngle / 180);
                const y2 = radius + radius * Math.sin(Math.PI * endAngle / 180);

                const largeArc = segmentAngle > 180 ? 1 : 0;
                const color = prize.color === 'red' ? '#DC143C' : '#222';

                // Draw segment
                svg += `
                    <path d="M${radius},${radius} L${x1},${y1} A${radius},${radius} 0 ${largeArc},1 ${x2},${y2} Z"
                        fill="${color}" stroke="#8b6508" stroke-width="4"/>
                `;

                // Position the prize text
                const textAngle = startAngle + segmentAngle / 2;
                const textRadius = radius * 0.65;
                const tx = radius + textRadius * Math.cos(Math.PI * textAngle / 180);
                const ty = radius + textRadius * Math.sin(Math.PI * textAngle / 180);

                svg += `
                    <text x="${tx}" y="${ty}" text-anchor="middle" alignment-baseline="middle"
                        fill="#fff" font-size="18" font-family="Georgia" transform="rotate(${textAngle},${tx},${ty})">
                        ${prize.prize}
                    </text>
                `;
            });

            svg += '</svg>';
            wheel.innerHTML = svg;
        }

        // Initial drawing of the wheel
        createWheel();

        // Spin the wheel
        function spin() {
            const wheel = document.getElementById('wheel-svg-container');
            const segmentCount = prizes.length;
            const segmentAngle = 360 / segmentCount;

            // Randomly select a prize index
            const randomIndex = Math.floor(Math.random() * segmentCount);

            // Add extra spins for animation
            const extraSpins = 5;
            const finalAngle = 360 * extraSpins - randomIndex * segmentAngle + segmentAngle / 2;

            // Reset transform
            wheel.style.transition = 'none';
            wheel.style.transform = `rotate(0deg)`;
            void wheel.offsetWidth; // Force reflow

            // Animate spin
            wheel.style.transition = 'transform 2s cubic-bezier(0.17, 0.67, 0.12, 0.99)';
            wheel.style.transform = `rotate(${finalAngle}deg)`;

            // Display result after animation
            setTimeout(() => {
                document.getElementById('result').textContent = `¡Ganaste: ${prizes[randomIndex - 1].prize}!`;
                document.getElementById('result').classList.add('win-animation');
                setTimeout(() => {
                    document.getElementById('result').classList.remove('win-animation');
                }, 1000);
            }, 2000);
        }
    </script>
</body>
</html>
